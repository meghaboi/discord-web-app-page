<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VR Cricket - Link Your Profile</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo {
            font-size: 60px;
            margin-bottom: 15px;
        }
        
        h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #666;
            font-size: 16px;
        }
        
        .avatar-section {
            text-align: center;
            margin: 30px 0;
        }
        
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 5px solid #5865F2;
            margin-bottom: 15px;
        }
        
        .display-name {
            font-size: 24px;
            font-weight: 700;
            color: #333;
            margin-bottom: 5px;
        }
        
        .username {
            color: #666;
            font-size: 16px;
        }
        
        .info-card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .info-card h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 18px;
        }
        
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .info-row:last-child {
            border-bottom: none;
        }
        
        .info-label {
            font-weight: 600;
            color: #555;
        }
        
        .info-value {
            color: #333;
            font-family: monospace;
            background: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 14px;
        }
        
        .success-box {
            background: #d4edda;
            border: 2px solid #28a745;
            color: #155724;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .success-box h2 {
            margin-bottom: 10px;
        }
        
        .btn {
            background: #5865F2;
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: all 0.3s ease;
        }
        
        .btn:hover {
            background: #4752C4;
            transform: translateY(-2px);
        }
        
        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .note {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
        }
        
        .note strong {
            color: #856404;
            display: block;
            margin-bottom: 5px;
        }
        
        .note p {
            color: #856404;
            font-size: 14px;
            line-height: 1.5;
        }
        
        .error {
            background: #f8d7da;
            border: 2px solid #f5c6cb;
            color: #721c24;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            color: #5865F2;
            font-size: 16px;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #5865F2;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">🏏</div>
            <h1>Link Your Profile</h1>
            <p class="subtitle">Connect your Discord with VR Cricket</p>
        </div>
        
        <div id="content"></div>
    </div>
    
    <script>
        // Get URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('user_id');
        const username = urlParams.get('username');
        const displayName = urlParams.get('display_name');
        const avatar = urlParams.get('avatar');
        const guildId = urlParams.get('guild_id');
        const roleId = urlParams.get('role_id');
        
        const contentDiv = document.getElementById('content');
        
        // IMPORTANT: Change this to your bot's server URL
        // For local testing: 'http://localhost:8080'
        // For production: 'http://YOUR_SERVER_IP:8080' or use ngrok
        const BOT_SERVER_URL = 'http://localhost:8080';
        
        if (!userId || !username) {
            // No user data in URL
            contentDiv.innerHTML = `
                <div class="error">
                    <h2>❌ Invalid Link</h2>
                    <p style="margin-top: 10px;">This link is missing user information. Please go back to Discord and click the button again.</p>
                </div>
            `;
        } else {
            // Display user info
            let roleInfo = '';
            if (roleId) {
                roleInfo = `<div class="info-row">
                    <span class="info-label">Role to Receive:</span>
                    <span class="info-value">Role ID: ${roleId}</span>
                </div>`;
            }
            
            contentDiv.innerHTML = `
                <div class="success-box">
                    <h2>✅ Discord Account Detected!</h2>
                    <p>We've received your Discord information</p>
                </div>
                
                <div class="avatar-section">
                    <img class="avatar" src="${avatar}" alt="Avatar">
                    <div class="display-name">${displayName || username}</div>
                    <div class="username">@${username}</div>
                </div>
                
                <div class="info-card">
                    <h3>🔗 Link Information</h3>
                    <div class="info-row">
                        <span class="info-label">Discord ID:</span>
                        <span class="info-value">${userId}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Username:</span>
                        <span class="info-value">${username}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Display Name:</span>
                        <span class="info-value">${displayName || 'Not set'}</span>
                    </div>
                    ${roleInfo}
                </div>
                
                <div class="note">
                    <strong>📝 What happens next?</strong>
                    <p>When you click "Complete Linking", your Discord profile will be linked to VR Cricket${roleId ? ' and you\'ll receive your role' : ''}!</p>
                </div>
                
                <button class="btn" id="linkButton" onclick="completeLink()">Complete Linking</button>
                <div id="statusMessage"></div>
            `;
            
            // Log data for development
            console.log('Received Discord Data:', {
                userId,
                username,
                displayName,
                avatar,
                guildId,
                roleId
            });
        }
        
        async function completeLink() {
            const button = document.getElementById('linkButton');
            const statusMessage = document.getElementById('statusMessage');
            
            // Disable button and show loading
            button.disabled = true;
            button.textContent = 'Linking...';
            statusMessage.innerHTML = '<div class="loading"><div class="spinner"></div>Connecting to Discord...</div>';
            
            try {
                // Send verification to bot
                const response = await fetch(`${BOT_SERVER_URL}/verify`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        user_id: userId,
                        guild_id: guildId,
                        role_id: roleId || null,
                        success: true
                    })
                });
                
                const data = await response.json();
                
                if (data.status === 'success') {
                    statusMessage.innerHTML = `
                        <div class="success-box" style="margin-top: 20px;">
                            <h2>✅ Successfully Linked!</h2>
                            <p>Your profile has been linked to VR Cricket!</p>
                            ${data.role_assigned ? `<p style="margin-top: 10px;">🎁 You received the <strong>${data.role_name}</strong> role!</p>` : ''}
                            <p style="margin-top: 10px;">Check your Discord DMs for confirmation.</p>
                        </div>
                    `;
                    button.textContent = 'Linked Successfully!';
                    button.style.background = '#28a745';
                } else {
                    throw new Error(data.message || 'Unknown error');
                }
                
            } catch (error) {
                console.error('Error linking profile:', error);
                statusMessage.innerHTML = `
                    <div class="error" style="margin-top: 20px;">
                        <h2>❌ Link Failed</h2>
                        <p style="margin-top: 10px;">Error: ${error.message}</p>
                        <p style="margin-top: 10px;">Please make sure the bot is running and try again.</p>
                    </div>
                `;
                button.disabled = false;
                button.textContent = 'Try Again';
            }
        }
    </script>
</body>
</html>
